name: Database proofs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL server
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
      - name: Provision empty database and run security proofs
        run: npm run verify:provisioning
